# JVM memory tuning
#org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -XX:+UseStringDeduplication -XX:+UseCompressedOops
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Gradle workers
#org.gradle.workers.max=2 # AGP 8.x ignores it and Flutter overrides it anywa

# Build cache
org.gradle.caching=true

# Kotlin compiler memory
kotlin.daemon.jvmargs=-Xmx1g

# Parallel configuration
org.gradle.parallel=true

# Incremental Kotlin
kotlin.incremental=true

# Incremental dexing
#android.enableDexingArtifactTransform=true

# Android build system
android.useAndroidX=true
# newDsl stays off: Flutter's Gradle plugin still depends on the old AGP DSL types.
android.newDsl=false
# AGP 9 compiles Kotlin itself (ID-043); AGP 10 removes the opt-out. A plugin that applies the
# Kotlin Gradle plugin unconditionally now fails the build rather than warning.
android.builtInKotlin=true
org.gradle.daemon=true
