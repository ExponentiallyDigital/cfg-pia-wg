name: cfg_pia_wg
description: cfg-pia-wg
version: 0.8.123+493
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  dartssh2: ^4.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.0
  purchases_flutter: ^10.12.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  x25519: ^0.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  mocktail: ^1.0.4
  dart_pubspec_licenses: ^3.2.0
  flutter_native_splash: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon_legacy.png
  adaptive_icon_background: "#001620"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # iOS (ID-260): the legacy icon redrawn at the 1024 the App Store needs, from its measured shapes,
  # since the largest original is 512. Kept out of assets/icon/ so the Android app doesn't carry them.
  # The App Store refuses an icon with an alpha channel; the dark and tinted ones (iOS 18) are the
  # same shapes on transparent, the tinted one made grey by the tool.
  # Run it as `dart run tool/launcher_icons.dart`, never directly: the tool (0.14.4) also rewrites
  # every ASSETCATALOG line in ios/Runner.xcodeproj/project.pbxproj to "= AppIcon;", breaking the
  # yes/no setting ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS, and the wrapper
  # puts those lines back (ID-374).
  ios: true
  image_path_ios: assets/ios_icon/app_icon_1024.png
  remove_alpha_ios: true
  background_color_ios: "#001620"
  image_path_ios_dark_transparent: assets/ios_icon/app_icon_1024_dark.png
  image_path_ios_tinted_grayscale: assets/ios_icon/app_icon_1024_dark.png
  desaturate_tinted_to_grayscale_ios: true
# The window the system draws while the app starts. Without one, Android shows a blank white
# rectangle before the first frame, which on a dark app reads as a flash (ID-111).
flutter_native_splash:
  color: "#001620"
  image: assets/icon/splash_detail.png
  android: true
  ios: true
  android_12:
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#001620"
