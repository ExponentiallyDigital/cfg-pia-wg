# ~/.gradle/gradle.properties
# tuned for 16C/32T Ryzen 9 9950X3D, 64 GB DDR5, NVMe

# --- AAPT2 (resource processing) ---
android.aapt2.daemon=true
# threadPoolSize left unset: defaults to available processors

# --- D8 / R8 (dexing + shrinking) ---
# full mode is the AGP 8.x default, better shrinking, affects release builds only
android.enableR8.fullMode=true

# --- Kotlin compiler ---
kotlin.incremental=true
# separate compiler daemon, gets its own heap, does not block the Gradle daemon
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC

# --- Gradle caching + configuration ---
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# --- Gradle daemon + JVM tuning ---
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Parallelism ---
org.gradle.parallel=true
# 16 physical cores; going to 32 mostly adds memory pressure and scheduling overhead
org.gradle.workers.max=16