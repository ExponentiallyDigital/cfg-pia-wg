name: "Quality & security"
run-name: "Quality & security - ${{ github.event_name }} - ${{ github.ref_name }}"

on:
  push:
    branches:
      # NOT main. A commit reaching main came through a pull request, which is checked below, and
      # anything being released is checked again by release.yml before it publishes - so scanning
      # the merge commit as well was the same code a third time. The cost of that was real: three
      # runs of fifteen minutes each is what drove development off main in the first place.
      - "feature/**"
      - "fix/**"
    # REMOVED: tags: ['v*'] — release.yaml handles tag triggers via workflow_call
  pull_request:
    branches:
      - main
  schedule:
    - cron: "25 17 * * 1"
  workflow_call:
  workflow_dispatch:

# One run per ref at a time. Pushing three times in a minute used to start three fifteen-minute
# runs that all scanned code already superseded, which is how the CPU-minute limit was reached in
# the first place. The newest push is the only one whose answer anyone wants.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  # ============================================================
  # Job 1: Static analysis, tests, and code quality
  # ============================================================
  quality:
    name: Quality & static analysis
    needs: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project, which the tests read (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter tests with coverage
        run: flutter test --coverage

      # SKIPPED for Dependabot. A Dependabot-triggered run does not read the normal Actions secrets
      # - it reads the separate "Dependabot" secrets store - so SONAR_TOKEN arrives empty and the
      # scanner dies on startup with exit code 3, which reads like a code problem and is not one.
      #
      # The fix is NOT to copy the token into that store. These pull requests bump GitHub Actions,
      # meaning they edit the very workflow files that would then run holding the token; a
      # compromised upstream action would be handed it. Nothing is lost by skipping: an action
      # version bump changes no Dart code, so Sonar has nothing new to say about it, and the Monday
      # `schedule` trigger above scans the default branch every week regardless.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # Job 2: Build Debug APK once for Security Scan & Release reuse
  # ============================================================
  build-debug:
    name: Build debug APK
    needs: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "21"
          # ID-074: reuse Gradle's wrapper download and dependencies between runs. The key includes the
          # lockfiles, which the default key misses; a restored cache still resolves under STRICT locking.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.lockfile

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project, which the tests read (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  # ============================================================
  # Job 2b: iOS simulator build (ID-405)
  # ============================================================
  # Builds the iOS app on macOS, so a change that breaks iOS - the Swift side, a plugin's pod, the Xcode
  # project - shows on the release PR rather than on Andrew's Mac. Unsigned and for the simulator, so it
  # needs no Apple certificate; signing and the App Store are ID-418. macOS runners cost nothing for a
  # public repository.
  #
  # The tests stay in the quality job on Linux. They run in the Dart VM whatever the host, and the ones
  # written for iOS run as iOS there (debugDefaultTargetPlatformOverride); here the script tests would
  # meet macOS's BSD sed and awk, which neither the router's BusyBox nor CI's Linux has.
  ios-build:
    name: iOS simulator build
    needs: osv-scan
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

  # ============================================================
  # Job 3: OSV dependency vulnerability scan - every other job waits on it
  # ============================================================
  # quality, build-debug and codeql `need` this job (and security needs build-debug), so a failed scan - a
  # vulnerability found, or the scanner itself failing - stops the run rather than spending fifteen minutes
  # on jobs whose result no longer matters (ID-056).
  #
  # No --exclude. osv-scanner renamed it --experimental-exclude, and the v2.6.0 scanner rejects the old name
  # ("flag provided but not defined: -exclude"). The two paths it named were the runner's own Go toolchain,
  # which is outside ./ and not visible inside the scanner's container, so they never excluded anything.
  # The reusable workflow runs the scanner with continue-on-error; before v2.6.0 it then reported a scan
  # that wrote no results as clean, so a scanner failure could pass unnoticed. v2.6.0 fails the job instead.
  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        -r ./
    permissions:
      contents: read
      security-events: write
      actions: read

  # ============================================================
  # Job 4: Mobile security scanning (MobSF)
  # ============================================================
  security:
    name: MobSF security scan
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@4645ea70bc093268502fe9f6df93e41bb482254a # 1.0.1
        with:
          args: "build/app/outputs/flutter-apk/app-debug.apk --sarif --output mobsfscan.sarif || true"

      - name: Upload MobSF results to Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: mobsfscan.sarif

  # ============================================================
  # Job 5: CodeQL analysis
  # ============================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: osv-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual # "autobuild" fails :/
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "21"
          # ID-074: as in build-debug - reuse Gradle's wrapper download and dependencies between runs.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.lockfile

      - name: Set up Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        if: matrix.language == 'java-kotlin'
        run: flutter pub get --enforce-lockfile

      - name: Build Android app to compile Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
