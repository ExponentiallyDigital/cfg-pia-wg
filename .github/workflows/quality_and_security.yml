name: "Quality & security"
run-name: "Quality & security - ${{ github.event_name }} - ${{ github.ref_name }}"

on:
  push:
    branches:
      # NOT main. A commit reaching main came through a pull request, which is checked below, and
      # anything being released is checked again by release.yml before it publishes - so scanning
      # the merge commit as well was the same code a third time. The cost of that was real: three
      # runs of fifteen minutes each is what drove development off main in the first place.
      - "feature/**"
      - "fix/**"
    # REMOVED: tags: ['v*'] — release.yaml handles tag triggers via workflow_call
  pull_request:
    branches:
      - main
  schedule:
    - cron: "25 17 * * 1"
  workflow_call:
  workflow_dispatch:

# One run per ref at a time. Pushing three times in a minute used to start three fifteen-minute
# runs that all scanned code already superseded, which is how the CPU-minute limit was reached in
# the first place. The newest push is the only one whose answer anyone wants.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  # ============================================================
  # Job 1: Static analysis, tests, and code quality
  # ============================================================
  quality:
    name: Quality & static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.1
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter tests with coverage
        run: flutter test --coverage

      # SKIPPED for Dependabot. A Dependabot-triggered run does not read the normal Actions secrets
      # - it reads the separate "Dependabot" secrets store - so SONAR_TOKEN arrives empty and the
      # scanner dies on startup with exit code 3, which reads like a code problem and is not one.
      #
      # The fix is NOT to copy the token into that store. These pull requests bump GitHub Actions,
      # meaning they edit the very workflow files that would then run holding the token; a
      # compromised upstream action would be handed it. Nothing is lost by skipping: an action
      # version bump changes no Dart code, so Sonar has nothing new to say about it, and the Monday
      # `schedule` trigger above scans the default branch every week regardless.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # Job 2: Build Debug APK once for Security Scan & Release reuse
  # ============================================================
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.1
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  # ============================================================
  # Job 3: OSV dependency vulnerability scan
  # ============================================================
  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r ./
        --exclude=/usr/local/go
        --exclude=/opt/hostedtoolcache/go
    permissions:
      contents: read
      security-events: write
      actions: read

  # ============================================================
  # Job 4: Mobile security scanning (MobSF)
  # ============================================================
  security:
    name: MobSF security scan
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@a43635d92434e78b079ed7d860f022cf6c886b43 # 1.0.0
        with:
          args: "build/app/outputs/flutter-apk/app-debug.apk --sarif --output mobsfscan.sarif || true"

      - name: Upload MobSF results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.38.0
        with:
          sarif_file: mobsfscan.sarif

  # ============================================================
  # Job 5: CodeQL analysis
  # ============================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual # "autobuild" fails :/
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.1
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Fetch dependencies
        if: matrix.language == 'java-kotlin'
        run: flutter pub get --enforce-lockfile

      - name: Build Android app to compile Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
