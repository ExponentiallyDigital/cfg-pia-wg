name: "Quality & security"
run-name: "Quality & security - ${{ github.event_name }} - ${{ github.ref_name }}"

on:
  push:
    branches:
      # NOT main. A commit reaching main came through a pull request, which is checked below, and
      # anything being released is checked again by release.yml before it publishes - so scanning
      # the merge commit as well was the same code a third time. The cost of that was real: three
      # runs of fifteen minutes each is what drove development off main in the first place.
      - "feature/**"
      - "fix/**"
    # REMOVED: tags: ['v*'] — release.yaml handles tag triggers via workflow_call
  pull_request:
    branches:
      - main
  schedule:
    - cron: "25 17 * * 1"
  workflow_call:
    inputs:
      # release.yml's call (ID-630). Its signed builds are stricter than the debug APK, the release bundle
      # and the iOS simulator build, and run beside these checks, so the release run leaves those three out
      # (and MobSF, which scans the debug APK) and the checks that remain are the ones that decide.
      release_run:
        description: "A release run: leave out the builds the signed release builds replace"
        type: boolean
        required: false
        default: false
  workflow_dispatch:

# One run per ref at a time. Pushing three times in a minute used to start three fifteen-minute
# runs that all scanned code already superseded, which is how the CPU-minute limit was reached in
# the first place. The newest push is the only one whose answer anyone wants.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  # ============================================================
  # Job 0: Did the iOS side change (ID-630)
  # ============================================================
  # The iOS simulator build takes 14 to 19 minutes on the one macOS runner that queues longest, and a
  # change to Dart or the Android side cannot break it in a way the signed iOS build of the release would
  # not also find. So on a pull request it runs only when ios/, pubspec.yaml, pubspec.lock or the workflow
  # itself changed. Every other trigger (a push, a manual run) builds it, and the weekly scan and a
  # release run leave it out, as ios-build's own condition says.
  changes:
    name: Did iOS change
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the base of the pull request
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the iOS build runs."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed in this pull request:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(ios/|pubspec\.yaml$|pubspec\.lock$|\.github/workflows/quality_and_security\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "The iOS side changed: the iOS build runs."
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the iOS build reads changed: it is left out."
          fi

  # ============================================================
  # Job 1: Static analysis, tests, and code quality
  # ============================================================
  quality:
    name: Quality & static analysis
    needs: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project, which the tests read (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter tests with coverage
        run: flutter test --coverage

      # ID-468: the release scripts' own tests. Standard library only: no key, no network.
      - name: Release script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # SKIPPED for Dependabot. A Dependabot-triggered run does not read the normal Actions secrets
      # - it reads the separate "Dependabot" secrets store - so SONAR_TOKEN arrives empty and the
      # scanner dies on startup with exit code 3, which reads like a code problem and is not one.
      #
      # The fix is NOT to copy the token into that store. These pull requests bump GitHub Actions,
      # meaning they edit the very workflow files that would then run holding the token; a
      # compromised upstream action would be handed it. Nothing is lost by skipping: an action
      # version bump changes no Dart code, so Sonar has nothing new to say about it, and the Monday
      # `schedule` trigger above scans the default branch every week regardless.
      - name: SonarQube scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # Job 2: Build Debug APK once for Security Scan & Release reuse
  # ============================================================
  build-debug:
    name: Build debug APK
    needs: osv-scan
    if: ${{ inputs.release_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: "21"
          # ID-074: reuse Gradle's wrapper download and dependencies between runs. The key includes the
          # lockfiles, which the default key misses; a restored cache still resolves under STRICT locking.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.lockfile

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project, which the tests read (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1

  # ============================================================
  # Job 2a: Release-mode Android build (ID-623)
  # ============================================================
  # The debug build above runs no R8, and R8 is where v0.8.214's signed build ran out of memory
  # (`:app:minifyReleaseWithR8`, Metaspace, ID-622) after pull request #82 had passed every check. A
  # release bundle is the only build that runs it, so a failure only the shrinker finds shows here, on
  # the pull request, and not on the tag.
  #
  # The release signing config reads android/key.properties and fails without it, so this job signs
  # with a key it makes for the run and throws away. R8 runs before signing, so the key is only there
  # to let the build finish. The RevenueCat key is a dummy: nothing here is published.
  build-release:
    name: Build release bundle
    needs: osv-scan
    # Not in a release run, where the signed bundle runs R8 with the real key, nor in the weekly scan (ID-630).
    if: ${{ inputs.release_run != true && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.lockfile

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run tool/launcher_icons.dart

      - name: Make a throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -alias throwaway -keyalg RSA -keysize 2048 \
            -validity 1 -storepass throwaway -keypass throwaway -dname "CN=throwaway"
          printf 'storeFile=%s\nstorePassword=throwaway\nkeyAlias=throwaway\nkeyPassword=throwaway\n' \
            "$RUNNER_TEMP/throwaway.jks" > android/key.properties

      - name: Build release bundle
        run: flutter build appbundle --release --dart-define=REVENUECAT_ANDROID_KEY=ci-check

  # ============================================================
  # Job 2b: iOS simulator build (ID-405)
  # ============================================================
  # Builds the iOS app on macOS, so a change that breaks iOS - the Swift side, a plugin's pod, the Xcode
  # project - shows on the release PR rather than on Andrew's Mac. Unsigned and for the simulator, so it
  # needs no Apple certificate; signing and the App Store are ID-418. macOS runners cost nothing for a
  # public repository.
  #
  # The tests stay in the quality job on Linux. They run in the Dart VM whatever the host, and the ones
  # written for iOS run as iOS there (debugDefaultTargetPlatformOverride); here the script tests would
  # meet macOS's BSD sed and awk, which neither the router's BusyBox nor CI's Linux has.
  ios-build:
    name: iOS simulator build
    needs: [osv-scan, changes]
    # Only when the iOS side changed, never in a release run or the weekly scan (ID-630): the release's signed
    # iOS build is stricter, and the scan looks for new vulnerabilities in code that has not changed.
    if: ${{ needs.changes.outputs.ios == 'true' && inputs.release_run != true && github.event_name != 'schedule' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        # The wrapper keeps the tool from damaging the Xcode project (ID-374).
        run: dart run tool/launcher_icons.dart

      - name: Build for the iOS simulator
        run: flutter build ios --simulator --debug --no-codesign

      # ID-395: ABOUT reads these from the built app's Info.plist, written by ios/stamp_build_info.sh.
      # A key that isn't there would only show as "unknown" on an iPhone, so read them back here.
      - name: Check the build info was stamped into the app
        run: |
          plist=build/ios/iphonesimulator/Runner.app/Info.plist
          for key in CfgGitCommit CfgGitCommitDate CfgGitBranch CfgRunnerId CfgBuildTimestamp CfgBuildType DTPlatformVersion DTXcode; do
            value=$(plutil -extract "$key" raw "$plist") || { echo "::error title=Build info not stamped::$key is missing from $plist"; exit 1; }
            echo "$key = $value"
          done
          [ "$(plutil -extract CfgRunnerId raw "$plist")" = "$GITHUB_RUN_ID" ] || { echo "::error::CfgRunnerId is not this run's id"; exit 1; }
          [ "$(plutil -extract CfgGitCommit raw "$plist")" = "$(git log -1 --abbrev=7 --format=%h)" ] || { echo "::error::CfgGitCommit is not this commit"; exit 1; }

      # ID-404: ios/RunnerTests drives the clipboard channel's Swift handler inside the app on a simulator -
      # copy, clear, read back nothing, and the copy's own expiry. The build above leaves what xcodebuild needs.
      - name: Run the iOS tests on a simulator
        shell: bash
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          [ -n "$udid" ] || { echo "::error::no iPhone simulator available"; xcrun simctl list devices available; exit 1; }
          echo "Simulator: $(xcrun simctl list devices available | grep "$udid" | sed 's/^ *//')"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "id=$udid" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log | grep -iE "test case|error:|executed|\*\* test"
          # A run that compiled no tests also "succeeds", so count them. Newer Xcode says "Test case", older "Test Case".
          passed=$(grep -ciE "test case .*passed" xcodebuild-test.log || true)
          echo "Tests passed: $passed"
          [ "$passed" -ge 4 ] || { echo "::error::expected 4 iOS tests to pass (ios/RunnerTests), saw $passed"; exit 1; }

      - name: Keep the xcodebuild log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          retention-days: 7

  # ============================================================
  # Job 3: OSV dependency vulnerability scan - every other job waits on it
  # ============================================================
  # quality, build-debug and codeql `need` this job (and security needs build-debug), so a failed scan - a
  # vulnerability found, or the scanner itself failing - stops the run rather than spending fifteen minutes
  # on jobs whose result no longer matters (ID-056).
  #
  # No --exclude. osv-scanner renamed it --experimental-exclude, and the v2.6.0 scanner rejects the old name
  # ("flag provided but not defined: -exclude"). The two paths it named were the runner's own Go toolchain,
  # which is outside ./ and not visible inside the scanner's container, so they never excluded anything.
  # The reusable workflow runs the scanner with continue-on-error; before v2.6.0 it then reported a scan
  # that wrote no results as clean, so a scanner failure could pass unnoticed. v2.6.0 fails the job instead.
  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        -r ./
    permissions:
      contents: read
      security-events: write
      actions: read

  # ============================================================
  # Job 4: Mobile security scanning (MobSF)
  # ============================================================
  security:
    name: MobSF security scan
    runs-on: ubuntu-latest
    needs: build-debug
    if: ${{ inputs.release_run != true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Run mobsfscan
        uses: MobSF/mobsfscan@e48f780d04c4fdd38ec07c1de3d2210513f48ecd # 1.2.0
        with:
          args: "build/app/outputs/flutter-apk/app-debug.apk --sarif --output mobsfscan.sarif || true"

      - name: Upload MobSF results to Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: mobsfscan.sarif

  # ============================================================
  # Job 5: CodeQL analysis
  # ============================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: osv-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual # "autobuild" fails :/
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "zulu"
          java-version: "21"
          # ID-074: as in build-debug - reuse Gradle's wrapper download and dependencies between runs.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.lockfile

      - name: Set up Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # ID-410: the version pinned in pubspec.yaml, the one tested locally, not whatever is stable today.
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies
        if: matrix.language == 'java-kotlin'
        run: flutter pub get --enforce-lockfile

      - name: Build Android app to compile Java/Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
