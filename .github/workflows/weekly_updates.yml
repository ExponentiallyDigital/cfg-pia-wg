name: "Weekly updates"
run-name: "Weekly updates - ${{ github.event_name }}"

# Three pull requests into dev, each only when there is something to bring:
#  - flutter (ID-410): a newer Flutter stable than the one pinned in pubspec.yaml.
#  - packages (ID-411): `flutter pub upgrade` within pubspec.yaml's constraints, the Gradle lockfiles
#    regenerated to match, and THIRD-PARTY-NOTICES.md regenerated - the three steps that had to be done
#    together by hand, since release.yml refuses a stale notices file.
#  - android-tools (ID-576): Gradle, the Android Gradle plugin and Kotlin to their latest releases, with
#    the lockfiles and notices regenerated. Dependabot can't move them, as it can't rewrite the STRICT
#    lockfiles. The PR says where each stands against the pinned Flutter's own known limits.
#
# Neither job commits to dev or main, or makes a build: every commit there is a build, and builds are
# Andrew's. He merges the PR into dev and it goes out in his next build.
#
# Each job runs analyze, the tests and a debug build itself, and the PR says how they went (a draft when
# any failed). It has to: a PR opened with the workflow's own token starts no other workflow, and CI
# doesn't run on PRs into dev anyway; the full suite runs on the release PR into main.
#
# Needs "Allow GitHub Actions to create and approve pull requests" on, in Settings > Actions > General.

on:
  schedule:
    # Monday 10:00 in Melbourne in winter, 11:00 in summer: after Dependabot's 09:00 run.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write # to push the bot/ branches
  pull-requests: write # to open and update their PRs

concurrency:
  group: weekly-updates
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

# Named, so GitHub runs it with pipefail: without it `flutter pub upgrade | tee upgrade.txt` passes
# even when the upgrade fails.
defaults:
  run:
    shell: bash

jobs:
  flutter:
    name: Newer Flutter stable?
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up Flutter (the pinned version)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Compare the pin with the latest stable
        id: pin
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/flutter_pin.dart --check

      # One PR per version. A closed one is an answer, so it isn't opened again next week.
      - name: Already proposed?
        id: seen
        if: steps.pin.outputs.newer == 'true'
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "bot/flutter-${{ steps.pin.outputs.latest }}" --state all --json number -q length)
          echo "PRs for this version: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Move the pin
        id: move
        if: steps.pin.outputs.newer == 'true' && steps.seen.outputs.count == '0'
        run: dart run tool/flutter_pin.dart --set "${{ steps.pin.outputs.latest }}"

      - name: Set up Java
        if: steps.move.outcome == 'success'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter (the new version)
        if: steps.move.outcome == 'success'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.latest }}
          channel: "stable"
          cache: true

      - name: Fetch dependencies
        if: steps.move.outcome == 'success'
        run: |
          flutter --version
          flutter pub get
          dart run tool/launcher_icons.dart

      - name: Analyze
        id: analyze
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter analyze --fatal-infos

      - name: Test
        id: test
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter test

      - name: Debug build
        id: build
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter build apk --debug

      # The notices name the Flutter SDK's version, and the packages job builds with the old pin, so this
      # job is the one that can bring it up to date (ID-507). After the build, so the Gradle cache holds the
      # Android libraries' POMs the tool reads their licences from.
      - name: Regenerate THIRD-PARTY-NOTICES.md
        id: notices
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: dart run tool/third_party_notices.dart

      - name: Open the PR
        if: steps.move.outcome == 'success'
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
          LATEST: ${{ steps.pin.outputs.latest }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NOTICES: ${{ steps.notices.outcome }}
        run: |
          branch="bot/flutter-$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pubspec.yaml pubspec.lock THIRD-PARTY-NOTICES.md
          git commit -m "Flutter $LATEST, from the weekly check (ID-410)"
          git push origin "$branch"
          draft=""
          [ "$ANALYZE$TEST$BUILD$NOTICES" = "successsuccesssuccesssuccess" ] || draft="--draft"
          {
            echo "Flutter $LATEST is the current stable; pubspec.yaml pins $PINNED. This moves the pin, which every workflow installs."
            echo
            echo "Checked in this run with Flutter $LATEST: analyze **$ANALYZE**, tests **$TEST**, debug build **$BUILD**, THIRD-PARTY-NOTICES.md **$NOTICES**. CI doesn't run on PRs into dev; the full suite runs on the release PR."
            echo
            echo "Before merging: upgrade Flutter locally (\`flutter upgrade\`), so scripts/build.ps1 stops warning, read the release notes for breaking changes, and add a CHANGELOG line to the next build."
            echo
            echo "Release notes: https://docs.flutter.dev/release/release-notes"
          } > body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" $draft --title "Flutter $PINNED -> $LATEST" --body-file body.md

  packages:
    name: Packages, lockfiles and notices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Within pubspec.yaml's constraints: a major version stays a deliberate step, listed in the PR.
      - name: Upgrade packages
        run: flutter pub upgrade | tee upgrade.txt

      # STRICT locking refuses a build whose dependencies differ from the lockfiles, so they are written
      # before anything builds. --config-only generates the Gradle wrapper, which isn't committed.
      - name: Regenerate the Gradle lockfiles
        run: |
          flutter build apk --config-only
          ./android/gradlew -p android :dependencies :app:dependencies --write-locks -q

      - name: Regenerate THIRD-PARTY-NOTICES.md
        run: dart run tool/third_party_notices.dart

      - name: Anything changed?
        id: diff
        run: |
          # On one line: ls-files prints one path per line, and a value with newlines in it breaks
          # $GITHUB_OUTPUT ("Invalid format"), which failed the first run on 2026-10-16.
          files="pubspec.lock THIRD-PARTY-NOTICES.md $(git ls-files 'android/*.lockfile' | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- $files; then
            echo "Nothing to update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- $files
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate launcher icons
        if: steps.diff.outputs.changed == 'true'
        run: dart run tool/launcher_icons.dart

      - name: Analyze
        id: analyze
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: flutter analyze --fatal-infos

      - name: Test
        id: test
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: flutter test

      - name: Debug build
        id: build
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: flutter build apk --debug

      # One branch, rebuilt from dev each week, so there is only ever one of these PRs.
      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          FILES: ${{ steps.diff.outputs.files }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          branch="bot/weekly-packages"
          {
            echo "This week's package upgrades within pubspec.yaml's constraints, with the Gradle lockfiles and THIRD-PARTY-NOTICES.md regenerated to match (ID-411)."
            echo
            echo "Checked in this run: analyze **$ANALYZE**, tests **$TEST**, debug build **$BUILD**. CI doesn't run on PRs into dev; the full suite runs on the release PR."
            echo
            echo "Before merging: add a CHANGELOG line to the next build saying what moved."
            echo
            echo "### What moved"
            echo '```'
            grep -E '^[>+*-] ' upgrade.txt || echo "(no Dart package changed; Android libraries only)"
            echo '```'
            echo '```'
            git diff --stat -- $FILES
            echo '```'
            echo "### Left behind: newer major versions"
            echo '```'
            flutter pub outdated --no-dev-dependencies 2>&1 | head -60 || true
            echo '```'
            echo "Gradle, the Android Gradle plugin and Kotlin are moved by their own weekly PR (ID-576)."
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- $FILES
          git commit -m "Weekly package, lockfile and notices update (ID-411)"
          git push --force origin "$branch"
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number -q length)
          if [ "$n" = "0" ]; then
            draft=""
            [ "$ANALYZE$TEST$BUILD" = "successsuccesssuccess" ] || draft="--draft"
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" $draft --title "Weekly package update" --body-file body.md
          else
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" --body-file body.md
          fi

  android-tools:
    name: Gradle, Android Gradle plugin and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Each to its latest release; the pinned Flutter's own limits are reported in the PR, not obeyed
      # (Andrew's decision, 2026-11-14). tool/android_tools.dart says why.
      - name: Newer versions?
        id: plan
        run: |
          flutter pub get --enforce-lockfile
          curl -sfL https://services.gradle.org/versions/current > gradle.json
          curl -sfL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml > agp.xml
          curl -sfL https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml > kotlin.xml
          root="$(dirname "$(dirname "$(command -v flutter)")")"
          dart run tool/android_tools.dart --check --gradle-json gradle.json --agp-xml agp.xml --kotlin-xml kotlin.xml \
            --flutter-utils "$root/packages/flutter_tools/lib/src/android/gradle_utils.dart" \
            --flutter "$(sed -nE 's/^  flutter: ([0-9.]+)$/\1/p' pubspec.yaml)"

      # One PR per set of versions. A closed one is an answer, so it isn't opened again next week.
      - name: Already proposed?
        id: seen
        if: steps.plan.outputs.changed == 'true'
        run: |
          branch="bot/android-tools-${{ steps.plan.outputs.gradle }}-${{ steps.plan.outputs.agp }}-${{ steps.plan.outputs.kotlin }}"
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number -q length)
          echo "PRs for these versions: $n"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # The wrapper refuses a distribution without its checksum, so the new one comes with it.
      - name: Move them
        id: move
        if: steps.plan.outputs.changed == 'true' && steps.seen.outputs.count == '0'
        run: |
          v="${{ steps.plan.outputs.gradle }}"
          # services.gradle.org answers this with a 301: without -L, curl hands back its HTML page.
          sha="$(curl -sfL "https://services.gradle.org/distributions/gradle-$v-all.zip.sha256")"
          echo "$sha" | grep -qxE '[0-9a-f]{64}' || { echo "no checksum published for Gradle $v"; exit 1; }
          dart run tool/android_tools.dart --set --gradle "$v" --gradle-sha "$sha" \
            --agp "${{ steps.plan.outputs.agp }}" --kotlin "${{ steps.plan.outputs.kotlin }}"
          git diff --stat -- android/

      # STRICT locking refuses a build whose dependencies differ from the lockfiles, so they are written
      # before anything builds. --config-only generates the Gradle wrapper, which isn't committed.
      - name: Regenerate the Gradle lockfiles
        id: locks
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: |
          flutter build apk --config-only
          ./android/gradlew -p android :dependencies :app:dependencies --write-locks -q

      - name: Generate launcher icons
        if: steps.move.outcome == 'success'
        run: dart run tool/launcher_icons.dart

      - name: Analyze
        id: analyze
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter analyze --fatal-infos

      - name: Test
        id: test
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter test

      - name: Debug build
        id: build
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: flutter build apk --debug

      - name: Regenerate THIRD-PARTY-NOTICES.md
        id: notices
        if: steps.move.outcome == 'success'
        continue-on-error: true
        run: dart run tool/third_party_notices.dart

      - name: Open the PR
        if: steps.move.outcome == 'success'
        env:
          BRANCH: ${{ steps.seen.outputs.branch }}
          LOCKS: ${{ steps.locks.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NOTICES: ${{ steps.notices.outcome }}
        run: |
          {
            cat android_tools.md
            echo
            echo "Checked in this run: lockfiles **$LOCKS**, analyze **$ANALYZE**, tests **$TEST**, debug build **$BUILD**, THIRD-PARTY-NOTICES.md **$NOTICES**. CI doesn't run on PRs into dev; the full suite runs on the release PR."
            echo
            echo "A debug build doesn't shrink or sign: before the next release, run release.yml's dry run (\`gh workflow run release.yml --ref dev -f dry_run=true -f tag_name=v<pubspec version>\`), the check this PR can't make."
            echo
            echo "Before merging: add a CHANGELOG line to the next build saying what moved."
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- android/gradle/wrapper/gradle-wrapper.properties android/settings.gradle.kts THIRD-PARTY-NOTICES.md $(git ls-files 'android/*.lockfile')
          git commit -m "Gradle, Android Gradle plugin and Kotlin, from the weekly check (ID-576)"
          git push origin "$BRANCH"
          draft=""
          [ "$LOCKS$ANALYZE$TEST$BUILD$NOTICES" = "successsuccesssuccesssuccesssuccess" ] || draft="--draft"
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" $draft --title "Gradle, Android Gradle plugin and Kotlin" --body-file body.md
