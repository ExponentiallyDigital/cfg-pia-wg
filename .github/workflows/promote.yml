# ==========================================================================
# GitHub Actions Workflow: Promote a release, on Google Play and the App Store
# Trigger manually via Actions tab after verifying build on physical devices
# ==========================================================================
# One run promotes the same build on both stores (ID-468). The App Store has no tracks, so each of
# Play's has its counterpart: internal is TestFlight's Internal group, which the tag already fills;
# alpha and beta are the external TestFlight group Family, after Beta App Review; production is App
# Review, then the release. The App Store side reads only the target: there is nothing to promote FROM.
name: "Promote release"
# The build number first, so the Actions list says what was promoted (ID-178).
run-name: "Promote build ${{ inputs.build }} - ${{ inputs.source_track }} to ${{ inputs.target_track }}${{ inputs.stores != 'both' && format(' ({0})', inputs.stores) || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number being promoted (e.g. 534). Both stores check they are promoting this build"
        type: string
        required: true
      source_track:
        description: "Source track to promote FROM"
        type: choice
        required: true
        default: "internal"
        options:
          - internal
          - alpha
          - beta
      # One step at a time by default, production last and marked, so it is never the thing a
      # quick click lands on (ID-178).
      target_track:
        description: "Target track to promote TO"
        type: choice
        required: true
        default: "alpha"
        options:
          - alpha
          - beta
          - "** PRODUCTION **"
      stores:
        description: "Which stores to promote on"
        type: choice
        required: true
        default: "both"
        options:
          - both
          - Google Play only
          - App Store only
      dry_run:
        description: "Show what would be promoted, and change nothing"
        type: boolean
        required: false
        default: false

permissions: {}
concurrency:
  group: promote-${{ inputs.source_track }}-${{ inputs.target_track }}
  cancel-in-progress: false # don't kill the in-flight one; queue the second

env:
  FROM_TRACK: ${{ inputs.source_track }}
  TO_TRACK: ${{ inputs.target_track == '** PRODUCTION **' && 'production' || inputs.target_track }}
  BUILD: ${{ inputs.build }}

jobs:
  check:
    name: Check the inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate inputs
        run: |
          if [ "$FROM_TRACK" = "$TO_TRACK" ]; then
            echo "::error::The source and target are both '$FROM_TRACK', so there is nothing to promote."
            exit 1
          fi
          case "$BUILD" in
            '' | *[!0-9]*)
              echo "::error::The build is '$BUILD'; it must be a build number, such as 534."
              exit 1
              ;;
          esac

  promote:
    name: Promote Google Play Track
    needs: check
    if: ${{ inputs.stores != 'App Store only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout the promote script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/play_promote.py
          sparse-checkout-cone-mode: false

      # ------------------------------------------------------------
      # Moves the release on source_track to target_track on the Google Play Console, without
      # downloading or re-uploading anything. A script of our own rather than
      # kevin-david/promote-play-release, which runs on the retired Node 20 (ID-179).
      # ------------------------------------------------------------
      - name: Promote track on Google Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
          PACKAGE_NAME: com.exponentiallydigital.pia_wireguard_cfga
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A virtual environment: the runner's system Python refuses pip installs (PEP 668).
          python3 -m venv "$RUNNER_TEMP/promote"
          "$RUNNER_TEMP/promote/bin/pip" install --quiet --disable-pip-version-check google-auth==2.58.0 requests==2.34.2
          "$RUNNER_TEMP/promote/bin/python" scripts/play_promote.py

  # ------------------------------------------------------------
  # The same build on the App Store (ID-468): to the Family group for alpha or beta, to App Review
  # and then the release for production. Run again, it reports what is already done.
  # ------------------------------------------------------------
  app-store:
    name: Promote on the App Store
    needs: check
    if: ${{ inputs.stores != 'Google Play only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the App Store Connect script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/app_store_connect.py
          sparse-checkout-cone-mode: false

      - name: Promote on the App Store
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet --disable-pip-version-check \
            PyJWT==2.10.1 cryptography==44.0.2 requests==2.34.2
          flag=""
          [ "$DRY_RUN" = "true" ] && flag="--dry-run"
          "$RUNNER_TEMP/asc/bin/python" scripts/app_store_connect.py promote --build "$BUILD" --to "$TO_TRACK" $flag
