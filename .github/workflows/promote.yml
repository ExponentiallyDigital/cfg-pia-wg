# ==========================================================================
# GitHub Actions Workflow: Promote release to production
# Trigger manually via Actions tab after verifying build on physical devices
# ==========================================================================
name: "Promote release"

on:
  workflow_dispatch:
    inputs:
      source_track:
        description: "Source track to promote FROM"
        type: choice
        required: true
        default: "internal"
        options:
          - internal
          - alpha
          - beta
      target_track:
        description: "Target track to promote TO"
        type: choice
        required: true
        default: "production"
        options:
          - production
          - beta
          - alpha

jobs:
  promote:
    name: Promote Google Play Track
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Promotes existing release on Google Play Console from
      # source_track to target_track without downloading/re-uploading files.
      # ------------------------------------------------------------
      - name: Promote track on Google Play
        uses: kevin-david/promote-play-release@d1ed59ca4fd7456b9d8cae062a3684e93b412425 # v1.2.0
        with:
          service-account-json-raw: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
          package-name: com.exponentiallydigital.pia_wireguard_cfga
          from-track: ${{ inputs.source_track }}
          to-track: ${{ inputs.target_track }}
