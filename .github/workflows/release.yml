name: "Build and release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without creating a release"
        type: boolean
        required: false
        default: false
      tag_name:
        description: "Tag name for manual release (e.g. v1.0.0)"
        type: string
        required: false
      build_apk:
        description: "Specify 'release-apk' to also build and package APKs"
        type: string
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================
  # Step 1: Force Quality & Security to run first on tag push
  # ============================================================
  quality-and-security:
    name: Quality & security checks
    uses: ./.github/workflows/quality_and_security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    secrets: inherit

  # ============================================================
  # Step 2: Build and release (only runs if quality checks succeed)
  # ============================================================
  release:
    name: Build and release
    needs: quality-and-security

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.quality-and-security.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download debug APK from quality checks
        if: ${{ inputs.build_apk == 'release-apk' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing KEYSTORE_BASE64" && exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=../release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set target tag name
        id: tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG_NAME:-$REF_NAME}"
          echo "val=$TAG" >> $GITHUB_OUTPUT

      - name: Build release assets
        env:
          BUILD_APK: ${{ inputs.build_apk }}
        run: |
          TAG="${{ steps.tag.outputs.val }}"
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons

          # 1. Always build App Bundle (.aab)
          flutter build appbundle --release
          mv build/app/outputs/bundle/release/cfg_pia_wireguard-release.aab \
             build/cfg-pia-wg-${TAG}_google-play-store.aab

          # 2. Conditionally build release APK if requested
          if [ "$BUILD_APK" = "release-apk" ]; then
            echo "Building Release APK..."
            flutter build apk --release
            mv build/app/outputs/flutter-apk/app-release.apk \
               build/cfg-pia-wg-${TAG}_release.apk

            if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              mv build/app/outputs/flutter-apk/app-debug.apk \
                 build/cfg-pia-wg-${TAG}_debug.apk
            fi
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: cfg-pia-wg-sbom.spdx.json

      - name: Rename SBOM
        run: |
          TAG="${{ steps.tag.outputs.val }}"
          mv cfg-pia-wg-sbom.spdx.json \
             cfg-pia-wg-${TAG}_sbom.spdx.json

      - name: Attest AAB
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/cfg-pia-wg-${{ steps.tag.outputs.val }}_google-play-store.aab

      - name: Attest release APK
        if: ${{ inputs.build_apk == 'release-apk' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/cfg-pia-wg-${{ steps.tag.outputs.val }}_release.apk

      - name: Attest debug APK
        if: ${{ inputs.build_apk == 'release-apk' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: build/cfg-pia-wg-${{ steps.tag.outputs.val }}_debug.apk

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Prepare release assets
        run: |
          TAG="${{ steps.tag.outputs.val }}"

          # Strip badges and inject version under the README.html title
          grep -v 'img.shields.io\|sonarcloud.io/api/project_badges' README.md \
            | sed "s/^# \(.*\)/# \1\n\n**Version:** ${TAG}/" \
            > /tmp/README.md

          pandoc /tmp/README.md -f gfm -t html -s --embed-resources --standalone -o build/README.html

          cp LICENSE build/LICENSE

      - name: Dry run notice
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run completed -- no release was created."

      - name: Upload release assets
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          files: |
            build/README.html
            build/LICENSE
            build/cfg-pia-wg-${{ steps.tag.outputs.val }}_google-play-store.aab
            cfg-pia-wg-${{ steps.tag.outputs.val }}_sbom.spdx.json
            build/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
