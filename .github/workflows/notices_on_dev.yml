name: "Notices after a dependency change"
run-name: "Notices after a dependency change - ${{ github.ref_name }}"

# ID-508. A push to dev that changes a dependency file - a bot or Dependabot merge, or a local commit -
# regenerates THIRD-PARTY-NOTICES.md and commits it straight back, with no PR to approve.
#
# Built so a compromised package can't use it to change the code:
# - "generate" runs the package code (pub get, the notices tool) and can only read the repo. Its checkout
#   keeps no credentials, and all it hands on is the one file, as an artifact.
# - "commit" can write, and runs no package code at all: no Flutter, no Dart. It takes the artifact only
#   if it is that one text file, and pushes only if dev hasn't moved since.
# - Lockfiles are only read (--enforce-lockfile), so no version changes here; versions still move only
#   through the bot and Dependabot PRs Andrew merges.
# - Launcher icons are left out: they ship in the app, and the tool that makes them is third-party code.
# A commit pushed with GITHUB_TOKEN starts no workflow, so this can't trigger itself.
# notices-test/** branches exist to prove it end to end without touching dev.

on:
  push:
    branches:
      - dev
      - "notices-test/**"
    paths:
      - pubspec.yaml
      - pubspec.lock
      - "android/**/*.lockfile"

permissions:
  contents: read

concurrency:
  group: notices-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Regenerate (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Fetch dependencies, as locked
        run: flutter pub get --enforce-lockfile

      - name: Regenerate THIRD-PARTY-NOTICES.md
        run: dart run tool/third_party_notices.dart

      - name: Anything changed?
        id: diff
        run: |
          other=$(git status --porcelain | grep -v ' THIRD-PARTY-NOTICES.md$' || true)
          if [ -n "$other" ]; then
            echo "::error::Only THIRD-PARTY-NOTICES.md may change here, and this did too:"
            echo "$other"
            exit 1
          fi
          if git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md is current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- THIRD-PARTY-NOTICES.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand on the file
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.md
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Commit (no package code)
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Take the file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: ${{ runner.temp }}/notices

      - name: Check it is the one text file, then commit it
        env:
          IN: ${{ runner.temp }}/notices
          PUSHED: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=$(find "$IN" -mindepth 1 | sed "s|^$IN/||")
          if [ "$files" != "THIRD-PARTY-NOTICES.md" ]; then
            echo "::error::Expected only THIRD-PARTY-NOTICES.md, got: $files"
            exit 1
          fi
          f="$IN/THIRD-PARTY-NOTICES.md"
          if [ ! -f "$f" ] || [ -L "$f" ] || [ "$(wc -c < "$f")" -gt 1048576 ] || ! grep -Iq . "$f"; then
            echo "::error::THIRD-PARTY-NOTICES.md isn't a plain text file under 1 MB."
            exit 1
          fi
          # A later push that changed the dependencies again has its own run, queued behind this one.
          # One that didn't leaves this file as the right one.
          if ! git diff --quiet "$PUSHED" HEAD -- pubspec.yaml pubspec.lock ':(glob)android/**/*.lockfile'; then
            echo "$BRANCH's dependencies changed again since this push; that push's own run will regenerate the notices."
            exit 0
          fi
          cp "$f" THIRD-PARTY-NOTICES.md
          if [ "$(git status --porcelain)" != " M THIRD-PARTY-NOTICES.md" ]; then
            echo "::error::Only THIRD-PARTY-NOTICES.md may change:"
            git status --porcelain
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "THIRD-PARTY-NOTICES.md regenerated after a dependency change (ID-508)" -- THIRD-PARTY-NOTICES.md
          git push origin "HEAD:$BRANCH"
