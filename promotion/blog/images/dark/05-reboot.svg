<text x="24" y="36.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#E8EAF0" text-anchor="start">The first minute after a restart</text>
<text x="24" y="58.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8892A4" text-anchor="start">Measured from a pinned device, once a second, over six boots. Not to scale.</text>
<text x="24" y="116.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FF5C5C" text-anchor="start">BEFORE: THE GUARD ALONE</text>
<rect x="24" y="140" width="406" height="40" rx="6" fill="#1A1D23" stroke="#2E3240"/>
<rect x="430" y="140" width="130" height="40" fill="#FF5C5C" opacity="0.85"/>
<rect x="560" y="140" width="216" height="40" rx="6" fill="#1A1D23" stroke="#00D4AA"/>
<text x="227.0" y="165.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8892A4" text-anchor="middle">router starting</text>
<text x="495.0" y="165.0" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#12141A" text-anchor="middle">3 to 6 s</text>
<text x="668.0" y="165.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#00D4AA" text-anchor="middle">guard in place</text>
<line x1="430" y1="184" x2="430" y2="200" stroke="#8892A4"/>
<text x="430" y="216.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="end">internet connection up</text>
<line x1="560" y1="184" x2="560" y2="200" stroke="#8892A4"/>
<text x="560" y="216.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="start">add-on code starts</text>
<text x="495.0" y="130.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FF5C5C" text-anchor="middle">pinned device reaches the internet directly, on 4 boots of 6</text>
<text x="24" y="256.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#00D4AA" text-anchor="start">NOW: THE ROUTER'S OWN NETWORK SERVICES FILTER</text>
<rect x="24" y="280" width="752" height="40" rx="6" fill="#1A1D23" stroke="#00D4AA"/>
<text x="400.0" y="305.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#00D4AA" text-anchor="middle">pinned devices held from the moment the router starts</text>
</svg>