<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"><defs><marker id="m8892A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8892A4"/></marker><marker id="m00D4AA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00D4AA"/></marker><marker id="mFF5C5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5C5C"/></marker><marker id="mEF9F27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF9F27"/></marker><marker id="mB69CFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B69CFF"/></marker><marker id="m19B3EE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#19B3EE"/></marker><marker id="m8B9CFC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B9CFC"/></marker></defs><rect width="800" height="600" fill="#12141A"/>
<text x="24" y="36.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#E8EAF0" text-anchor="start">What the watchdog does</text>
<text x="24" y="58.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8892A4" text-anchor="start">On the router, every few minutes, whether your phone is on or not</text>
<rect x="100.0" y="76" width="380" height="56" rx="8" fill="#1A1D23" stroke="#B69CFF" stroke-width="1.5"/>
<text x="290.0" y="98.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">cron wakes the watchdog</text>
<text x="290.0" y="119.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">every N minutes, your choice</text>
<line x1="290" y1="134" x2="290" y2="152" stroke="#8892A4" stroke-width="2" marker-end="url(#m8892A4)"/>
<path d="M290 154.0 L440.0 196 L290 238.0 L140.0 196 z" fill="#1A1D23" stroke="#B69CFF" stroke-width="1.5"/>
<text x="290" y="193.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Is the tunnel passing traffic?</text>
<text x="290" y="211.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">a ping through it</text>
<line x1="442.0" y1="196" x2="586" y2="196" stroke="#00D4AA" stroke-width="2" marker-end="url(#m00D4AA)"/>
<text x="454.0" y="188.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#00D4AA" text-anchor="start">yes</text>
<rect x="590" y="168" width="186" height="56" rx="8" fill="#1A1D23" stroke="#00D4AA" stroke-width="1.5"/>
<text x="683.0" y="190.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Log it, and sleep</text>
<text x="683.0" y="211.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">nothing else changes</text>
<line x1="290" y1="240.0" x2="290" y2="262" stroke="#FF5C5C" stroke-width="2" marker-end="url(#mFF5C5C)"/>
<text x="302" y="256.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF5C5C" text-anchor="start">no</text>
<rect x="100.0" y="266" width="380" height="50" rx="8" fill="#1A1D23" stroke="#2E3240" stroke-width="1.5"/>
<text x="290.0" y="285.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Fetch PIA's server list</text>
<text x="290.0" y="306.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">and check its signature, as PIA's own app does</text>
<line x1="290" y1="318" x2="290" y2="330" stroke="#8892A4" stroke-width="2" marker-end="url(#m8892A4)"/>
<rect x="100.0" y="332" width="380" height="50" rx="8" fill="#1A1D23" stroke="#2E3240" stroke-width="1.5"/>
<text x="290.0" y="351.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Ping the region's servers</text>
<text x="290.0" y="372.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">and take the fastest</text>
<line x1="290" y1="384" x2="290" y2="396" stroke="#8892A4" stroke-width="2" marker-end="url(#m8892A4)"/>
<rect x="100.0" y="398" width="380" height="50" rx="8" fill="#1A1D23" stroke="#2E3240" stroke-width="1.5"/>
<text x="290.0" y="417.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Make a new key pair</text>
<text x="290.0" y="438.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">and register it with that server</text>
<line x1="290" y1="450" x2="290" y2="462" stroke="#8892A4" stroke-width="2" marker-end="url(#m8892A4)"/>
<rect x="100.0" y="464" width="380" height="50" rx="8" fill="#1A1D23" stroke="#2E3240" stroke-width="1.5"/>
<text x="290.0" y="483.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Write the slot</text>
<text x="290.0" y="504.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">and restart that one tunnel</text>
<line x1="290" y1="516" x2="290" y2="528" stroke="#8892A4" stroke-width="2" marker-end="url(#m8892A4)"/>
<rect x="100.0" y="530" width="380" height="50" rx="8" fill="#1A1D23" stroke="#8B9CFC" stroke-width="1.5"/>
<text x="290.0" y="549.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EAF0" text-anchor="middle">Email you</text>
<text x="290.0" y="570.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#8892A4" text-anchor="middle">how long it was down, and whether the kill switch held</text>
<path d="M498.0 266 L508.0 266 L508.0 514 L498.0 514" fill="none" stroke="#EF9F27" stroke-width="2"/>
<text x="522.0" y="372.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#EF9F27" text-anchor="start">The kill switch holds</text>
<text x="522.0" y="392.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8EAF0" text-anchor="start">throughout: pinned devices</text>
<text x="522.0" y="408.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8EAF0" text-anchor="start">stay offline until the new</text>
<text x="522.0" y="424.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8EAF0" text-anchor="start">tunnel is up</text>
</svg>