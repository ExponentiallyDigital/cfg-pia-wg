<text x="24" y="36.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1F27" text-anchor="start">Traffic and DNS take different roads</text>
<text x="24" y="58.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6474" text-anchor="start">On stock firmware, the connection decides the traffic, not the lookups</text>
<text x="24" y="106.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#D23A3A" text-anchor="start">NOT PINNED</text>
