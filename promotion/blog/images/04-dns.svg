<text x="206" y="412.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#00856A" text-anchor="start">lookups</text>
<text x="24" y="450.0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6474" text-anchor="start">The watchdog does its own lookups, for PIA and your mail server, over encrypted DNS to a server you choose.</text>
