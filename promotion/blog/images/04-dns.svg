<text x="681.0" y="156.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6474" text-anchor="middle">your browsing</text>
<rect x="300" y="186" width="190" height="50" rx="8" fill="#F4F6F9" stroke="#CDD3DD" stroke-width="1.5"/>
<text x="395.0" y="205.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B1F27" text-anchor="middle">Router's resolver</text>
