<text x="681.0" y="205.1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B1F27" text-anchor="middle">Your ISP</text>
<text x="681.0" y="226.3" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6474" text-anchor="middle">every name you look up</text>
